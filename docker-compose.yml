version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hri-database
    restart: always
    environment:
      POSTGRES_DB: hospital_resource_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hri-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TESTING=False
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hospital_resource_intelligence
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173", "http://127.0.0.1:5173"]
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: hri-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
